<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.D.A.P.T. Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>A.D.A.P.T. <span>PORTAL</span></h1>
            </div>
            <div>
                <p>Advanced Diagnostics and Autonomous Penetration Testing</p>
            </div>
        </header>

        <div class="card" id="input-section">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('git')">GIT REPOSITORY</button>
                <button class="tab" onclick="switchTab('zip')">ZIP ARCHIVE</button>
            </div>

            <div style="margin-top: 1rem; margin-bottom: 1rem; display: flex; justify-content: center; align-items: center;">
                <label for="n-rounds" style="font-weight: 700; margin-right: 1rem; font-size: 0.9rem;">SIMULATION ROUNDS:</label>
                <input type="number" id="n-rounds" value="3" min="1" max="20" style="width: 80px; padding: 0.5rem; border: 1px solid var(--border); border-radius: 2px;">
            </div>

            <div id="tab-git" class="tab-content active">
                <input type="text" id="git-url" placeholder="https://github.com/your/repo.git">
                <button class="btn btn-primary" onclick="submitGit()" style="margin-top: 1rem;">ANALYZE REPOSITORY</button>
            </div>

            <div id="tab-zip" class="tab-content">
                <div class="file-upload">
                    <label id="file-label">
                        CLICK TO SELECT OR DRAG ZIP ARCHIVE HERE
                    </label>
                    <input type="file" id="zip-file" accept=".zip" onchange="updateFileLabel(this)">
                </div>
                <button class="btn btn-primary" onclick="submitZip()">ANALYZE ARCHIVE</button>
            </div>
        </div>

        <div class="card hidden" id="dashboard-section">
            <h2 style="font-weight:700; letter-spacing: -0.5px; margin-bottom: 1rem;">SIMULATION STATUS: <span id="sim-status" class="status-running">IN PROGRESS</span></h2>
            
            <div id="loading-bar-container" class="loading-bar-container hidden">
                <div id="loading-bar" class="loading-bar"></div>
            </div>

            <div class="terminal">
                <div class="terminal-header">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="terminal-body" id="log-output">
                </div>
            </div>

            <div class="results hidden" id="results-section">
                <h3 style="margin-bottom:1rem; font-weight:700; letter-spacing:-0.5px;">EXECUTIVE SUMMARY</h3>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value blue-text" id="stat-tested">0</div>
                        <div class="stat-label">Techniques Tested</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value red-text" id="stat-passed">0</div>
                        <div class="stat-label">Red Team Breaches</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value green-text" id="stat-blocked">0</div>
                        <div class="stat-label">Blue Team Blocks</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="stat-cost" style="color: #f39c12;">$0.00</div>
                        <div class="stat-label">Est. Inference Cost</div>
                    </div>
                </div>

                <div style="display: flex; gap: 2rem; align-items: stretch; margin-top: 2rem;">
                    <div style="flex: 1; max-width: 300px;">
                        <canvas id="resultChart"></canvas>
                    </div>
                    <div style="flex: 2;" class="vulns-section">
                        <h4>Vulnerabilities Identified</h4>
                        <ul class="vuln-list" id="vuln-list">
                        </ul>
                    </div>
                </div>
                
                <div style="margin-top: 2rem; display: flex; flex-direction: column; align-items: center;" id="graph-container" class="hidden">
                    <h4 style="text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; margin-bottom: 1rem; color: var(--text-muted);">Generated Control Flow Graph (CFG)</h4>
                    <img id="cfg-graph-img" src="" alt="CFG Graph" style="max-width: 100%; border: 1px solid var(--border); border-radius: 2px;">
                </div>
                
                <div style="margin-top: 2rem; text-align: right;">
                    <button class="btn btn-secondary" id="btn-download" onclick="downloadReport()">DOWNLOAD REPORT (PDF)</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/app.js?v=4"></script>
</body>
</html>
