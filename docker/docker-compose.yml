services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    privileged: true # required for Mininet network namespaces
    depends_on:
      - ollama

  telemetry:
    build:
      context: ..
      dockerfile: docker/Dockerfile.telemetry
    privileged: true # required for eBPF kernel probes and Sysmon-for-Linux
    depends_on:
      - sandbox

  vuln-web-sqli:
    image: adapt/vuln-web-sqli:latest
    container_name: vuln-web-sqli
    ports:
      - "8080:8080"

  vuln-web-cmdi:
    image: adapt/vuln-web-cmdi:latest
    container_name: vuln-web-cmdi
    ports:
      - "8081:8081"

volumes:
  ollama_data:
