[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adapt"
version = "0.1.0"
description = "A.D.A.P.T. -- an LLM-routed, local-only red-team/blue-team cyber-range simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "stix2>=3.0",
    "networkx>=3.0",
    "mininet",
    "impacket>=0.11",
    "chromadb>=0.5",
    "ollama>=0.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adapt"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.pyright]
extraPaths = ["."]
